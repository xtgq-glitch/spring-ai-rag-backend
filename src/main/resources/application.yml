server:
  port: 8080

spring:
  application:
    name: spring-ai-rag-demo
  # Optionally load local, git-ignored overrides (application-local.yml in the project root)
  config:
    import: optional:file:./application-local.yml
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  ai:
    deepseek:
      # The API key is NOT configured here: put it in application-local.yml (not committed)
      # or provide it through the DEEPSEEK_API_KEY environment variable.
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
    # Embeddings use the local ONNX model all-MiniLM-L6-v2 (384 dimensions), loaded from the
    # classpath so no network access is required at runtime. If the model files are removed,
    # switch to remote URLs (hf-mirror.com works from mainland China):
    #   embedding:
    #     transformer:
    #       onnx:
    #         model-uri: https://hf-mirror.com/Xenova/all-MiniLM-L6-v2/resolve/main/onnx/model.onnx
    #       tokenizer:
    #         uri: https://hf-mirror.com/Xenova/all-MiniLM-L6-v2/resolve/main/tokenizer.json
    embedding:
      transformer:
        onnx:
          model-uri: classpath:/onnx/all-MiniLM-L6-v2/model.onnx
        tokenizer:
          uri: classpath:/onnx/all-MiniLM-L6-v2/tokenizer.json
